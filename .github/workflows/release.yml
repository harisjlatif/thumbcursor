name: Release

# Every push to main that changes the app is tested, built and published as a
# GitHub release. Docs-only changes don't create a release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Bump this for bigger changes; the patch number counts up automatically.
  MAJOR_MINOR: "1.0"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build
        run: make dist VERSION="$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/Thumbcursor-$VERSION.zip" \
            --title "Thumbcursor $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
